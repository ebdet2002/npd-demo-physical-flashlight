<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Flashlight CAD Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; background: #0B0C0E; color: #F4F1EC;
      font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #canvas-holder { position: absolute; inset: 0; }
    #hud {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      background: rgba(28,31,38,0.85); border: 1px solid #FF6B00;
      border-radius: 8px; padding: 14px 18px; min-width: 260px;
    }
    #hud h1 { font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
      font-size: 20px; margin: 0 0 8px 0; color: #FF6B00; letter-spacing: 0.5px; }
    #hud .dim-row { display: flex; justify-content: space-between; font-size: 14px; margin: 4px 0; }
    #hud .dim-label { color: #4FD1FF; }
    #hud .dim-value { font-weight: 600; }
    #hud .status { font-size: 12px; opacity: 0.7; margin-top: 10px; }
    #file-picker { position: absolute; top: 16px; right: 16px; z-index: 10; }
    select {
      background: #1C1F26; color: #F4F1EC; border: 1px solid #4FD1FF;
      border-radius: 6px; padding: 6px 10px; font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="canvas-holder"></div>
  <div id="hud">
    <h1>Flashlight Body — CAD Viewer</h1>
    <div class="dim-row"><span class="dim-label">Width (X)</span><span class="dim-value" id="dim-x">—</span></div>
    <div class="dim-row"><span class="dim-label">Height (Y)</span><span class="dim-value" id="dim-y">—</span></div>
    <div class="dim-row"><span class="dim-label">Depth (Z)</span><span class="dim-value" id="dim-z">—</span></div>
    <div class="status" id="status">Loading STL…</div>
  </div>
  <div id="file-picker">
    <select id="stl-select">
      <option value="../../cad/stl/flashlight_body_v1.stl">flashlight_body_v1.stl</option>
    </select>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.min.js"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
